{%- extends "base.html" -%}
{%- block title -%}Novo <Registro>% endblock -%</Registro>

{%- block content -%}
    <h2>Novo cadastro</h2>
    <form action="/salvar" method="post" enctype="multipart/form-data">
        <label> Nome / Título </label>
        <input type="text" name="campo_nome" required>

        <label> Informações complementares </label>
        <input type="text" name="campo_info" required>

        <label> Categorias </label>
        <select name="campo_categoria" required>
            <option value="">Selecione uma categoria</option>
            {% for categoria in categorias %}
                <option value="{{ categoria.id }}">{{ cat.nome }}</option>
            {% endfor %}
        </select>
        <label> Valor / Preço </label>
        <input type="number" name="campo_valor" step="0.01" placeholder="0.00" required>

        <label> Foto / Imagem </label>
        <input type="file" name="campo_imagem" accept="image/*">

        <button type="submit">Salvar Registro</button>
    </form>
{%- endblock -%}
